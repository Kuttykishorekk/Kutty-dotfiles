# macOS-inspired animations (popin open/close + smooth workspace/layer transitions)
# See https://wiki.hyprland.org/Configuring/Advanced-and-Cool/Animations/
# Select via: Super+Shift+Y or animations.conf

animations {
    enabled = yes

    # Primary curve — Apple-like ease-out (CSS ease-out expo-ish)
    bezier = macos, 0.22, 1, 0.36, 1
    # Drawer / workspace deceleration (Caelestia launcher, bar layers)
    bezier = menu_decel, 0.1, 1, 0, 1
    bezier = menu_accel, 0.38, 0.04, 1, 0.07

    # Windows: pop-in on open/close (macOS scale feel), smooth slide when moving
    animation = windows, 1, 4, macos, popin 80%
    animation = windowsIn, 1, 4, macos, popin 80%
    animation = windowsOut, 1, 3, macos, popin 80%
    animation = windowsMove, 1, 4, macos

    # Fades — important with transparent/glass windows
    animation = fade, 1, 4, macos
    animation = fadeIn, 1, 4, macos
    animation = fadeOut, 1, 3, macos
    animation = fadeSwitch, 1, 4, macos
    animation = fadeDim, 1, 4, macos

    # Caelestia / waybar layer surfaces
    animation = layersIn, 1, 3, menu_decel, slide
    animation = layersOut, 1, 2, menu_accel
    animation = fadeLayersIn, 1, 2, menu_decel
    animation = fadeLayersOut, 1, 3, menu_accel

    # Workspaces — subtle slide+fade (Mission Control–ish)
    animation = workspaces, 1, 6, menu_decel, slidefade 12%
    animation = workspacesIn, 1, 6, menu_decel, slidefade 12%
    animation = workspacesOut, 1, 5, menu_accel, slidefade 12%

    # Secret / scratchpad workspaces (Super+S, Super+R)
    animation = specialWorkspace, 1, 4, menu_decel, slidevert
    animation = specialWorkspaceIn, 1, 4, menu_decel, slidevert
    animation = specialWorkspaceOut, 1, 3, menu_accel, slidevert

    animation = border, 1, 1, default
    animation = borderangle, 1, 30, default, once
}
