# macOS-style animations
# Inspired by macOS Mission Control workspace switching
# See https://wiki.hyprland.org/Configuring/Animations/

animations {
    enabled = yes
    
    # macOS-style bezier curve (smooth, easing)
    bezier = macos, 0.22, 1, 0.36, 1
    
    # Window animations
    animation = windows, 1, 5, macos
    animation = windowsIn, 1, 5, macos
    animation = windowsOut, 1, 5, macos
    animation = windowsMove, 1, 5, macos
    
    # Workspace animations (like Mission Control)
    animation = workspaces, 1, 6, macos
    
    # Other animations
    animation = border, 1, 1, default
    animation = borderangle, 1, 30, default, once
    animation = fade, 1, 5, default
}
