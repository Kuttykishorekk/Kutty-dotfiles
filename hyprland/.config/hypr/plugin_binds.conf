
# ----------------------------------------------------- 
# Delayed Plugin Keybindings
# ----------------------------------------------------- 
$mainMod = Super
$caelestia=Caelestia Shell
$ws=Workspaces

$d=[$caelestia|Rofi menus]
bind = $mainMod, TAB, gloview:toggle

$d=[$ws|Navigation]
bind = $mainMod Alt, W, gloview:toggle
bind = $mainMod Shift, TAB, gloview:desktop
bind = $mainMod Ctrl, TAB, gloview:allworkspaces
