# Set your personal hyprland configuration here
# See https://wiki.hyprland.org/Configuring for more information

# // █ █▄░█ █▀█ █░█ ▀█▀
# // █ █░▀█ █▀▀ █▄█ ░█░


#  Uncomment to enable // change to a preferred value
# 🔗 See https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = fr
    follow_mouse = 1
    sensitivity = 0.5  # Input sensitivity (0.0-1.0, higher = faster movement)
    # force_no_accel = 0
    accel_profile = flat
    # numlock_by_default = true

    # 🔗 See https://wiki.hyprland.org/Configuring/Variables/#touchpad
    touchpad {
        natural_scroll = yes
        scroll_factor = 3.0
        disable_while_typing = true
    }

}

# Window borders configuration handled in themes/theme.conf
source = ./themes/theme.conf

# 🔗 See https://wiki .hyprland.org/Configuring/Variables/#gestures
gestures {
#     workspace_swipe = true
#     workspace_swipe_fingers = 3
}

# for window shallow similar to devour
misc {
    # enable_swallow = true
    # swallow_regex = (foot|kitty|allacritty|Alacritty|ghostty|Ghostty|org.wezfurlong.wezterm)
}

# Don't show update on first launch
ecosystem {
  # no_update_news = true
}

# Set cursor size via environment variable
env = XCURSOR_SIZE,36

# Caelestia Shell - Modern QML-based desktop shell
exec-once = caelestia shell -d
# Reload hyprpm plugins on startup (loads hyprexpo, dynamic-cursors, etc.)
exec-once = hyprpm reload -n
# Started by HyDE startup.conf already
# exec-once = hypridle
# Start Quickshell Overview for workspace management
exec-once = qs -c overview

# Caelestia Battery Notifications disabled - using only Caelestia's notification system
# exec-once = ~/.local/bin/caelestia-battery-notify.sh

# Dynamic Cursors Plugin - Realistic cursor physics and shake to find
# Note: Plugin is now loaded in hyprland.conf before keybindings
# exec-once = hyprctl plugin load /home/kutty/.local/lib/hyprland/dynamic-cursors.so

# Dynamic Cursors Configuration
# See https://github.com/VirtCode/hypr-dynamic-cursors for full documentation
plugin:dynamic-cursors {
    # Enable the plugin
    enabled = true

    # Cursor behavior mode:
    # tilt    - tilt cursor based on x-velocity (default, most realistic)
    # rotate  - rotate cursor based on movement direction
    # stretch - stretch cursor shape based on direction and velocity
    # none    - disable cursor effects (only shake to find)
    mode = stretch

    # Minimum angle difference in degrees before shape changes
    # Lower = smoother but more expensive for hardware cursors
    threshold = 1

    # Tilt mode configuration (active when mode = tilt)
    tilt {
        # Speed (px/s) at which full tilt (60°) is reached
        # Lower = more tilt at slower speeds
        limit = 2000

        # Activation function: linear, quadratic, negative_quadratic
        # negative_quadratic = more aggressive, feels snappier
        function = negative_quadratic

        # Time window (ms) for speed calculation
        # Higher = smoother but more delayed
        window = 50
    }

    # Shake to find - magnifies cursor when shaken (like KDE/macOS)
    shake {
        # Enable shake to find
        enabled = true

        # Use pixelated scaling when shaking
        nearest = true

        # How soon a shake is detected (lower = sooner)
        threshold = 6.0

        # Magnification level immediately after shake start
        base = 4.0
        # Magnification increase per second when continuing to shake
        speed = 4.0
        # How much speed is influenced by shake intensity
        influence = 0.0

        # Maximum magnification (0 = no limit)
        limit = 0.0

        # Timeout (ms) after shake ends before cursor returns to normal
        timeout = 500
    }
}
