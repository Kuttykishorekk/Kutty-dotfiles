
$GTK_THEME=Gtk_Tundra
$ICON_THEME=Zafiro-Nord-Black
$COLOR_SCHEME=prefer-dark
$CURSOR_THEME=volantes_cursors
$CURSOR_SIZE=36




general {
    gaps_in = 1
    gaps_out = 2
    border_size = 0
    # No borders - completely borderless windows
    col.active_border = rgba(00000000)
    col.inactive_border = rgba(00000000)
    layout = dwindle
    resize_on_border = false
}

dwindle {
    preserve_split = true
    smart_split = false
}

group {
    # No borders - completely borderless windows
    col.border_active = rgba(00000000)
    col.border_inactive = rgba(00000000)
    col.border_locked_active = rgba(00000000)
    col.border_locked_inactive = rgba(00000000)
}

decoration {
    rounding = 16

    shadow {
        enabled = no
        offset = 4 4
        range = 0
        render_power = 4
        # ignore_window deprecated
        color = 0xff000000
    }
    blur {
        enabled = yes
        size = 6
        passes = 1
        new_optimizations = on
        ignore_opacity = on
        xray = false
        noise = 0.01
        contrast = 0.92
        brightness = 0.9
        popups = on
        popups_ignorealpha = 0.2
    }
}

layerrule = blur false,match:namespace waybar
